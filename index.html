        const jarContainer = document.getElementById('jarContainer');
        const mainContent = document.getElementById('mainContent');
        const overlayContainer = document.getElementById('overlayContainer');
        const noteDate = document.getElementById('noteDate');
        const noteText = document.getElementById('noteText');
        const noteImg = document.getElementById('noteImg');
        const noteVid = document.getElementById('noteVid');

        // --- NON-REPEATING SHUFFLE QUEUE LOGIC ---
        let shuffledQueue = [];

        function getShuffledIndex() {
            if (shuffledQueue.length === 0) {
                // Create an array of indexes [0, 1, 2, ..., N-1]
                shuffledQueue = Array.from({ length: missedNotes.length }, (_, i) => i);
                // Fisher-Yates Shuffle Algorithm
                for (let i = shuffledQueue.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffledQueue[i], shuffledQueue[j]] = [shuffledQueue[j], shuffledQueue[i]];
                }
            }
            // Pull and remove the last item from the queue
            return shuffledQueue.pop();
        }

        // Live Counter Logic (April 13, 2026 @ 7:20 PM)
        const startDate = new Date('2026-04-13T19:20:00');
        document.addEventListener("DOMContentLoaded", function() {
            function updateTicker() {
                const now = new Date();
                const difference = now - startDate;
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);
                document.getElementById('liveTicker').innerText = `In your orbit for: ${days} d ${hours} h ${minutes} m ${seconds} s`;
            }
            setInterval(updateTicker, 1000);
            updateTicker();
        });

        function displayCurrentNote() {
            const index = getShuffledIndex();
            const selectedNote = missedNotes[index];

            noteDate.innerText = selectedNote.date;
            noteText.innerText = selectedNote.text;

            noteImg.style.display = 'none';
            noteVid.style.display = 'none';
            try { noteVid.pause(); } catch (e){}

            if (selectedNote.image) {
                noteImg.src = selectedNote.image;
                noteImg.style.display = 'block';
            }
            if (selectedNote.video) {
                noteVid.src = selectedNote.video;
                noteVid.style.display = 'block';
            }
        }

        function wakeTheInk() {
            displayCurrentNote();
            jarContainer.classList.add('open');
            setTimeout(() => {
                mainContent.classList.add('blur-bg');
                overlayContainer.classList.add('active');
            }, 450); 
        }

        function nextChit() {
            // Adds a subtle scale/fade effect when switching notes inside the modal
            const noteChit = document.querySelector('.note-chit');
            noteChit.style.transform = 'scale(0.95) translateY(10px)';
            noteChit.style.opacity = '0.7';

            setTimeout(() => {
                displayCurrentNote();
                noteChit.style.transform = 'scale(1) translateY(0)';
                noteChit.style.opacity = '1';
            }, 200);
        }

        function closeChit() {
            overlayContainer.classList.remove('active');
            mainContent.classList.remove('blur-bg');
            setTimeout(() => {
                jarContainer.classList.remove('open');
            }, 300);
        }
    </script>
